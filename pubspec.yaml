name: suivi_medical
description: "MediConsult - Application de consultation médicale - Master Télémédecine & e-Santé"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0

  # Données
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  connectivity_plus: ^6.0.0

  # Sécurité
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Utilitaires
  intl: ^0.20.2
  provider: ^6.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
